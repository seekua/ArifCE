name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore ArifCE.slnx
      - name: Build
        run: dotnet build ArifCE.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ArifCE.slnx --configuration Release --no-build --no-restore
      - name: Secret scan
        shell: pwsh
        run: ./scripts/secret-scan.ps1
      - name: README locale parity
        shell: pwsh
        run: ./scripts/check-readme-locales.ps1
      - name: README human review status
        shell: pwsh
        run: ./scripts/check-readme-review-status.ps1
      - name: Version consistency
        shell: pwsh
        run: ./scripts/check-version-consistency.ps1
      - name: Engineering benchmark manifest
        shell: pwsh
        run: ./scripts/validate-engineering-benchmark.ps1 -ValidateManifestOnly
      - name: Package smoke test
        shell: pwsh
        run: ./scripts/package-smoke.ps1 -Configuration Release

  self-contained-cli:
    name: Self-contained CLI (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Publish self-contained binary
        shell: pwsh
        run: ./scripts/publish-self-contained.ps1 -Runtime $env:ARIFCE_RID -Configuration Release
        env:
          ARIFCE_RID: ${{ matrix.rid }}
      - name: Run binary smoke check
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath "artifacts/self-contained/${{ matrix.rid }}" -File | Where-Object { $_.Name -notlike 'SHA256SUMS' -and $_.Extension -notin @('.dll', '.json', '.pdb') } | Select-Object -First 1
          if ($null -eq $binary) { throw 'Published executable not found' }
          & $binary.FullName help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke check failed with exit code $LASTEXITCODE" }
      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: arifce-${{ matrix.rid }}
          path: artifacts/self-contained/${{ matrix.rid }}
          if-no-files-found: error
