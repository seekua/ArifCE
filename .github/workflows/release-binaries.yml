name: Prepare self-contained release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Publish binary
        shell: pwsh
        run: ./scripts/publish-self-contained.ps1 -Runtime $env:ARIFCE_RID -Configuration Release
        env:
          ARIFCE_RID: ${{ matrix.rid }}
      - name: Run binary smoke check
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath "artifacts/self-contained/${{ matrix.rid }}" -File | Where-Object { $_.Name -notlike 'SHA256SUMS' -and $_.Extension -notin @('.dll', '.json', '.pdb') } | Select-Object -First 1
          if ($null -eq $binary) { throw 'Published executable not found' }
          & $binary.FullName help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke check failed with exit code $LASTEXITCODE" }
      - name: Package binary
        shell: pwsh
        run: |
          $source = "artifacts/self-contained/${{ matrix.rid }}"
          $archive = "artifacts/arifce-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive -Force
      - uses: actions/upload-artifact@v6
        with:
          name: arifce-${{ matrix.rid }}
          path: artifacts/arifce-${{ matrix.rid }}.zip
          if-no-files-found: error

  bundle:
    name: Verify release bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: arifce-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify archives and write release checksums
        shell: pwsh
        run: ./scripts/write-release-checksums.ps1 -ArchiveDirectory ./artifacts/release -VerifyArchives
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: arifce-release-bundle
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS
          if-no-files-found: error
