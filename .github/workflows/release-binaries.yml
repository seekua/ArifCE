name: Prepare self-contained release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify release tag matches package version
        shell: pwsh
        env:
          ARIFCE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:ARIFCE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:ARIFCE_TAG" }
          $project = Get-Content ./src/ArifCE.Cli/ArifCE.Cli.csproj -Raw
          $version = [regex]::Match($project, '<Version>(?<v>[^<]+)</Version>').Groups['v'].Value
          if ("v$version" -ne $env:ARIFCE_TAG) { throw "Tag $env:ARIFCE_TAG does not match CLI package version $version." }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Publish binary
        shell: pwsh
        run: ./scripts/publish-self-contained.ps1 -Runtime $env:ARIFCE_RID -Configuration Release
        env:
          ARIFCE_RID: ${{ matrix.rid }}
      - name: Run binary smoke check
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath "artifacts/self-contained/${{ matrix.rid }}" -File | Where-Object { $_.Name -notlike 'SHA256SUMS' -and $_.Extension -notin @('.dll', '.json', '.pdb') } | Select-Object -First 1
          if ($null -eq $binary) { throw 'Published executable not found' }
          & $binary.FullName help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke check failed with exit code $LASTEXITCODE" }
      - name: Package binary
        shell: pwsh
        run: |
          $source = "artifacts/self-contained/${{ matrix.rid }}"
          $archive = "artifacts/arifce-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive -Force
      - uses: actions/upload-artifact@v6
        with:
          name: arifce-${{ matrix.rid }}
          path: artifacts/arifce-${{ matrix.rid }}.zip
          if-no-files-found: error

  bundle:
    name: Verify and publish release bundle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: arifce-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify archives and write release checksums
        shell: pwsh
        run: ./scripts/write-release-checksums.ps1 -ArchiveDirectory ./artifacts/release -VerifyArchives
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: arifce-release-bundle
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS
          if-no-files-found: error
      - name: Publish immutable GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARIFCE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$env:ARIFCE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Tag does not exist: $env:ARIFCE_TAG" }

          $assets = @(Get-ChildItem -LiteralPath artifacts/release -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS' } | Sort-Object Name)
          if ($assets.Count -ne 6) { throw "Expected five archives and SHA256SUMS, found $($assets.Count) assets." }

          $releaseExists = $true
          $existingNames = @(gh release view $env:ARIFCE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>$null)
          if ($LASTEXITCODE -ne 0) { $releaseExists = $false; $existingNames = @() }
          $conflicts = @($assets.Name | Where-Object { $existingNames -contains $_ })
          if ($conflicts.Count -gt 0) { throw "Release asset conflict; refusing to overwrite: $($conflicts -join ', ')" }

          if (-not $releaseExists) {
            gh release create $env:ARIFCE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title $env:ARIFCE_TAG
            if ($LASTEXITCODE -ne 0) { throw "Unable to create release $env:ARIFCE_TAG." }
          }

          gh release upload $env:ARIFCE_TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets for $env:ARIFCE_TAG." }
